version: '3.8'  # Версия синтаксиса Docker Compose
services:
  qdrant:
    # ========================================================================
    # QDRANT: ВЕКТОРНАЯ БАЗА ДАННЫХ ДЛЯ ПОИСКА ПО АНАЛОГИИ
    # ========================================================================
    # Qdrant — это высокопроизводительная векторная база данных, специализирующаяся
    # на приближённом поиске похожих объектов (ANN — Approximate Nearest Neighbors).
    # Используется для хранения эмбеддингов и выполнения семантического поиска.
    # ------------------------------------------------------------------------
    # Использование официального образа Qdrant с Docker Hub
    # 'latest' означает использование последней стабильной версии
    image: qdrant/qdrant:latest
    
    # Имя контейнера для удобного управления (docker ps, docker logs и т.д.)
    container_name: qdrant
    # ========================================================================
    
    # ========================================================================
    # ПОРТЫ: СЕТЕВОЕ ВЗАИМОДЕЙСТВИЕ С ВНЕШНИМ МИРОМ
    # ========================================================================
    # Проброс портов между хост-системой и контейнером:
    #   Формат: "внешний_port:внутренний_port"
    # ------------------------------------------------------------------------
    ports:
      - "6333:6333"    # HTTP REST API — основной интерфейс для клиентов (index.py, search.py)
      - "6334:6334"    # gRPC API — для высокопроизводительных клиентов (опционально)
    # ========================================================================
    
    # ========================================================================
    # ТОМЫ: ПОСТОЯННОЕ ХРАНЕНИЕ ДАННЫХ
    # ========================================================================
    # Данные Qdrant сохраняются в локальную папку 'qdrant_storage',
    # чтобы не теряться при перезапуске или удалении контейнера.
    # ------------------------------------------------------------------------
    # Документация: https://qdrant.tech/documentation/guides/manage-collections/#persistence
    # ------------------------------------------------------------------------
    volumes:
      - ./qdrant_storage:/qdrant/storage
    # ========================================================================
    
    # ========================================================================
    # ПЕРЕМЕННЫЕ ОКРУЖЕНИЯ: НАСТРОЙКА QDRANT
    # ========================================================================
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Настройка порта gRPC API
    # ========================================================================
    
    # ========================================================================
    # ПОЛИТИКА ПЕРЕЗАПУСКА
    # ========================================================================
    # 'unless-stopped' — контейнер всегда перезапускается при ошибках,
    # кроме случаев явной остановки (docker stop) или удаления.
    restart: unless-stopped