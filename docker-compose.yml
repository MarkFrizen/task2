version: '3.8'  # Версия синтаксиса Docker Compose
services:
  qdrant:
    # Использование официального образа Qdrant с Docker Hub
    # 'latest' означает использование последней стабильной версии
    image: qdrant/qdrant:latest
    
    # Имя контейнера для удобного управления
    container_name: qdrant
    
    # Настройка проброса портов между хостом и контейнером
    # Формат: "внешний_port:внутренний_port"
    ports:
      - "6333:6333"    # HTTP API для взаимодействия с клиентами (используется index.py и search.py)
      - "6334:6334"    # gRPC API (опционально, для высокопроизводительных клиентов)
    
    # Настройка томов (persistent storage)
    # Данные Qdrant сохраняются в локальную папку 'qdrant_storage',
    # чтобы не теряться при перезапуске или удалении контейнера
    volumes:
      - ./qdrant_storage:/qdrant/storage
    
    # Переменные окружения для настройки Qdrant
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334  # Настройка порта gRPC (должен совпадать с проброшенным)
    
    # Политика перезапуска контейнера
    # 'unless-stopped' — контейнер всегда перезапускается, кроме случаев явной остановки
    restart: unless-stopped